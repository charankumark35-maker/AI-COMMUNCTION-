services:
  - type: web
    name: ai-communication-coach-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Auto-generated by Render
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL in dashboard
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false          # Set your Gemini API Key in dashboard

